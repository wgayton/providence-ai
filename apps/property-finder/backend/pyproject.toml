[project]
name = "property-finder"
version = "0.1.0"
description = "AI-powered abandoned property search for rural North Carolina"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "anthropic>=0.39.0",
    "voyageai>=0.3.0",
    "pgvector>=0.3.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "prefect>=3.0.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres]>=4.8.0",
    "vcrpy>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: marks tests that hit Claude/Voyage APIs (deselect with -m 'not llm')",
]
